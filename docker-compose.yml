version: "3.8"

services:
  tracker:
    build: .
    command: ["python", "-u", "tracker.py"]
    networks:
      - rede_p2p
  no_a:
    build: .
    environment:
      - TRACKER_HOST=tracker
      - TRACKER_PORT=9000
    volumes:
      - ./drive_A:/app/one_piece_drive
    networks:
      - rede_p2p
    depends_on:
      - tracker

  no_b:
    build: .
    environment:
      - TRACKER_HOST=tracker
      - TRACKER_PORT=9000
    volumes:
      - ./drive_B:/app/one_piece_drive
    networks:
      - rede_p2p
    depends_on:
      - tracker

  no_c:
    build: .
    environment:
      - TRACKER_HOST=tracker
      - TRACKER_PORT=9000
    volumes:
      - ./drive_C:/app/one_piece_drive
    networks:
      - rede_p2p
    depends_on:
      - tracker

networks:
  rede_p2p:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
